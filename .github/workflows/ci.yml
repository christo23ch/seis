name: CI — Lint, Build, Test

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -r requirements-dev.txt -q
      - name: Lint (pylint)
        run: cd backend && pylint app --max-line-length=120 --disable=C0103,C0114,C0115,R0913 --fail-under=8
        continue-on-error: true

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -r requirements.txt -r requirements-dev.txt -q
      - name: Run tests
        run: cd backend && python -m pytest tests/ -q --tb=short
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost/seis_test
          REDIS_URL: redis://localhost:6379/0
          SEIS_ENV: test

  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          cd backend && pip install -r requirements-dev.txt -q
      - name: Typecheck (mypy)
        run: cd backend && mypy app --ignore-missing-imports --no-error-summary 2>&1 | head -20 || true
        continue-on-error: true

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: cd frontend && npm ci --prefer-offline --no-audit -q
      - name: Lint
        run: cd frontend && npm run lint
      - name: Format check
        run: cd frontend && npm run format:check

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: cd frontend && npm ci --prefer-offline --no-audit -q
      - name: Build
        run: cd frontend && npm run build

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: cd frontend && npm ci --prefer-offline --no-audit -q
      - name: Unit tests
        run: cd frontend && npm run test -- --run

  summary:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, frontend-lint]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ] || [ "${{ needs.frontend-lint.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ CI passed"

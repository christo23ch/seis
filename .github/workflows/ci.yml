# Integración continua de la Fase 11 (Bloque F′).
#
# Hasta ahora la CI ejecutaba **un fichero de test de dieciséis**
# (`migraciones.yml`), y el motivo estaba bien razonado: la suite arrastra dos
# fallos preexistentes de PDF que dejarían el pipeline permanentemente en rojo,
# y una barrera siempre roja no vigila nada. Pero automatizar despliegues sobre
# esa base sería automatizar la propagación de regresiones.
#
# Este pipeline cierra ese hueco instalando `fonts-dejavu-core` en el runner,
# igual que hace `backend/Dockerfile`, con lo que el runner se parece a la imagen
# que se despliega y los dos rojos de PDF desaparecen.
#
# La fuente es cobertura ADICIONAL, no el mecanismo que tapa el problema: la
# causa raíz del fallo de PDF se corrigió en `pdf_service.py` (una viñeta que se
# concatenaba fuera del saneador), y `tests/test_pdf_respaldo.py` fuerza las dos
# ramas con `monkeypatch` en lugar de depender de si la máquina tiene la fuente.
# Instalarla aquí hace que el runner ejercite además el camino con DejaVu, que en
# desarrollo local no se ejecuta nunca porque `_DEJAVU` es una ruta POSIX
# absoluta y en Windows no puede existir.
name: CI

on:
  push:
    paths-ignore:
      # `**.md` NO se ignora: `docs/SEIS_informe_ejemplo_caso19.md` es insumo de
      # `test_ningun_caracter_del_informe_DORADO_...`, y regenerar el informe es
      # justo el cambio que ese test dice vigilar. Solo se ignora el Vault.
      - '02-Diario/**'
      - '30-Decisiones/**'
      - '40-Fases/**'
  pull_request:
    paths-ignore:
      # `**.md` NO se ignora: `docs/SEIS_informe_ejemplo_caso19.md` es insumo de
      # `test_ningun_caracter_del_informe_DORADO_...`, y regenerar el informe es
      # justo el cambio que ese test dice vigilar. Solo se ignora el Vault.
      - '02-Diario/**'
      - '30-Decisiones/**'
      - '40-Fases/**'

# Mínimo privilegio: estos jobs clonan y prueban. No escriben nada, no publican
# artefactos y no hablan con la API de GitHub.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Suite completa del backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SEIS_ENV: test
      JWT_SECRET: secreto-de-ci-sin-valor-productivo
      ADMIN_PASSWORD: admin-de-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # Misma fuente que instala `backend/Dockerfile`: el runner debe parecerse
      # al artefacto que se despliega, no a una máquina cualquiera.
      - name: Instalar la fuente DejaVu
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # `-rs` en la MISMA ejecución y no en un paso aparte: repetir la suite solo
      # para listar omisiones duplicaría el tiempo de CI. Los `skip` no son
      # verdes, y dejarlos visibles impide que un test omitido por configuración
      # ausente pase por un test que pasa.
      - name: Suite completa
        run: python -m pytest tests -q -rs --no-header

  postgres:
    name: Caminos exclusivos de PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Job aparte y no PostgreSQL en `suite`: corre EN PARALELO, así que el tiempo
    # de pared de la CI no sube, y la suite general sigue sobre SQLite, que es lo
    # que usa el desarrollo. Levantar Postgres para los 449 tests que no lo
    # necesitan solo alargaría el trabajo de todos.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seis_test
          POSTGRES_PASSWORD: seis_test
          # El nombre DEBE contener «test»: la guarda de aislamiento de los tests
          # se niega a tocar una base que no se declare desechable, y estos tests
          # borran tablas.
          POSTGRES_DB: seis_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEIS_ENV: test
      JWT_SECRET: secreto-de-ci-sin-valor-productivo
      ADMIN_PASSWORD: admin-de-ci
      # Variable DEDICADA, nunca DATABASE_URL: un valor de producción exportado
      # por accidente no puede colarse aquí.
      SEIS_TEST_POSTGRES_URL: postgresql+psycopg2://seis_test:seis_test@localhost:5432/seis_test_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # La comprobación de omisiones no es celo: este job existe para ejecutar
      # tres caminos que no se habían ejecutado NUNCA. Si la variable de entorno
      # o el servicio faltaran, pytest los omitiría y el job saldría verde sin
      # haber probado nada — que es exactamente el fallo que este job viene a
      # cerrar. Un verde que no ejecutó nada es peor que un rojo.
      - name: Caminos exclusivos de PostgreSQL (incluye T5)
        run: |
          set -o pipefail
          python -m pytest -m postgres -q -rs --no-header | tee /tmp/salida-postgres
          if grep -q "skipped" /tmp/salida-postgres; then
            echo "::error::Algún test marcado postgres se omitió. Este job existe" \
                 "para ejecutarlos: revise el servicio y SEIS_TEST_POSTGRES_URL."
            exit 1
          fi

  frontend:
    name: Compilación del frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Playwright es devDependency del frontend desde la Fase 14 (la prueba de
      # alta de punta a punta), pero este job SOLO compila: no abre un navegador.
      # Sin esto, `npm ci` se descarga Chromium en cada runner nuevo. Medido: la
      # caché de npm pasó de ~60 MB a 169 MB en la primera ejecución que lo
      # incluyó. El e2e se ejecuta a mano con `npm run e2e`, donde el navegador
      # ya está instalado.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # `npm run build` es la barrera de tipos del proyecto: TypeScript estricto,
      # y el build falla ante cualquier error de tipado.
      - name: Compilar
        run: npm run build

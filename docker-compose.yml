version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seis}
      POSTGRES_USER: ${POSTGRES_USER:-seis}
      # Sin valor de respaldo a propósito: un default embebido aquí sería público
      # (está en el repositorio) y desplegaría la BD con una contraseña conocida.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env antes de arrancar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seis}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Publicado SOLO en loopback: la BD no debe ser alcanzable desde fuera del
      # host. Los servicios internos la usan por la red de Compose (host `db`).
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Redis no lleva autenticación: igual que la BD, solo loopback.
      - "127.0.0.1:6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-seis}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env antes de arrancar}@db:5432/${POSTGRES_DB:-seis}
      REDIS_URL: redis://redis:6379/0
      SEIS_ENV: ${SEIS_ENV:-production}
      SEIS_CORS_ORIGINS: ${SEIS_CORS_ORIGINS:-http://localhost:3000}
      # Cierre Fase 12 (P0.1): SIN valor por defecto a propósito. Si `.env` no los
      # define, el backend arranca vacío y la guardia de app/core/config.py aborta
      # el arranque en vez de usar el secreto público del repositorio.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env antes de arrancar}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@seis.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env antes de arrancar}
      # Fase 10 — anti-abuso del login y de los endpoints públicos que envían
      # correo. Se propagan aunque tengan valor por defecto en config.py: sin
      # esta línea, ajustarlos en `.env` no tendría ningún efecto dentro del
      # contenedor y el operador no tendría forma de notarlo (es el defecto P1
      # que la Fase 12 dejó registrado con SES y SMTP).
      LOGIN_MAX_INTENTOS: ${LOGIN_MAX_INTENTOS:-5}
      LOGIN_VENTANA_MIN: ${LOGIN_VENTANA_MIN:-15}
      # Fase 12 — notificaciones (sin valor: el canal queda inactivo, nada rompe)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@seis.local}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NOMBRE: ${TELEGRAM_BOT_NOMBRE:-}
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # --beat embebido (Fase 12): programa el digest horario y el polling de Telegram.
  # Si en la Fase 11 se escala a varias réplicas, extraer el beat a su propio servicio
  # para no duplicar las tareas programadas.
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery worker --beat --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-seis}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env antes de arrancar}@db:5432/${POSTGRES_DB:-seis}
      REDIS_URL: redis://redis:6379/0
      SEIS_ENV: ${SEIS_ENV:-production}
      # Cierre Fase 12 (P0.1): el worker firma los mismos JWT/enlaces de baja que
      # el backend — debe compartir el secreto, nunca caer en el default público.
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env antes de arrancar}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@seis.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env antes de arrancar}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@seis.local}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NOMBRE: ${TELEGRAM_BOT_NOMBRE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

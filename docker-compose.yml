version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seis}
      POSTGRES_USER: ${POSTGRES_USER:-seis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seis_dev_pwd}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seis}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-seis}:${POSTGRES_PASSWORD:-seis_dev_pwd}@db:5432/${POSTGRES_DB:-seis}
      REDIS_URL: redis://redis:6379/0
      SEIS_ENV: ${SEIS_ENV:-production}
      SEIS_CORS_ORIGINS: ${SEIS_CORS_ORIGINS:-http://localhost:3000}
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-seis}:${POSTGRES_PASSWORD:-seis_dev_pwd}@db:5432/${POSTGRES_DB:-seis}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seis}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-seis}:${POSTGRES_PASSWORD:-seis_dev_pwd}@db:5432/${POSTGRES_DB:-seis}
      REDIS_URL: redis://redis:6379/0
      SEIS_ENV: ${SEIS_ENV:-production}
      SEIS_CORS_ORIGINS: ${SEIS_CORS_ORIGINS:-http://localhost:3000}
    command: >
      sh -c "alembic upgrade head &&
             python -m scripts.init_db &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery worker --loglevel=INFO --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-seis}:${POSTGRES_PASSWORD:-seis_dev_pwd}@db:5432/${POSTGRES_DB:-seis}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # frontend: se incorpora en la Fase 3 (Next.js 15). El puerto 3000 queda reservado.
  # frontend:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:

    y_bono_10a: 3.2
    rvc_veto: 0.85
    piso_pesimista_frac_i: 0.0

adjudicacion:                      # M13 capa A (§11.1) — ratios s/VT por segmento
  ratios:
    judicial_boe:
      vivienda: {ocupado: 0.42, vacio: 0.55, desconocida: 0.45}
      default: 0.50
    aeat: {default: 0.55}
    tgss: {default: 0.50}
    concursal: {default: 0.60}
    banco: {default: 0.75}
    notarial: {default: 0.55}
    privada: {default: 0.80}
    default: {default: 0.55}
  ajuste_desierta_pp: -0.08        # cada subasta previa desierta
  ajuste_chollo_pp: 0.06           # VT/VM < 0.6 atrae competencia
  rvc_bandas: [{min: 1.05, banda: alcanzable}, {min: 0.90, banda: ajustado},
               {min: 0.80, banda: improbable}, {min: 0.0, banda: inviable}]

scoring_expres:                    # Fase 12 — pesos del scoring exprés de captación (orientativo)
  pesos:                           # suma libre; se normaliza al calcular
    descuento: 40                  # descuento aparente VS sobre valor de referencia
    fuente: 15                     # atractivo típico del canal de captación
    desiertas: 15                  # subastas previas desiertas (menos competencia)
    informacion: 20                # completitud de datos brutos (P4)
    plazo: 10                      # margen para due diligence antes del cierre
  fuentes:                         # atractivo 0-100 por fuente (cf. ratios §11.1)
    judicial_boe: 70
    aeat: 65
    tgss: 60
    concursal: 75
    banco: 45
    notarial: 60
    privada: 35
    default: 50


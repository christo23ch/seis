    rvc_veto: 0.78
  oportunista:
    nombre: "Compra oportunista"
    tipo: venta
    m_objetivo: 0.35
    m_minimo: 0.25
    piso_pesimista_frac_i: 0.0
    rvc_veto: 0.88
  rentista:

# ============================================================================
# SEIS · Parámetros T3 · versión 2026.07
# Valores iniciales profesionales según la especificación. En producción viven
# en la tabla `parametro` con vigencia; este fichero es la semilla y el fallback.
# AVISO (§ gobernanza): los tipos fiscales y reglas legales deben validarse con
# asesoría jurídico-fiscal y revisarse ante cada cambio normativo.
# ============================================================================
version: "2026.07"


valoracion:
  descuento_oferta_portal: 0.06   # oferta → cierre (§6.3)
  k_estado: {reformado: 1.00, bueno: 0.92, regular: 0.82, malo: 0.72, ruina: 0.55}
  delta_base_pp: 2.0
  delta_dispersion:               # d_dispersion según CV (§9.4)
    - {max_cv: 0.10, pp: 0.0}
    - {max_cv: 0.18, pp: 1.0}
    - {max_cv: 0.25, pp: 2.5}
    - {max_cv: 99.0, pp: 4.0}
  delta_max_pct: 0.20
  n_min_comparables: 6
  cv_max_ok: 0.20
  sanidad_vt_vm: {min: 0.5, max: 1.6}   # hecho tasacion_anomala fuera de banda (§6.3)

reforma:
  baremos_m2: {ninguna: 0, refresco: 120, ligera: 375, media: 560, integral: 875, estructural: 1150}
  nivel_por_estado: {reformado: ninguna, bueno: refresco, regular: ligera, malo: media, ruina: estructural}
  niveles_obra_mayor: [media, integral, estructural]
  pct_tecnico_licencia: {menor: 0.04, mayor: 0.09}
  spread_p80:
    con_visita: {ninguna: 0.0, refresco: 0.12, ligera: 0.15, media: 0.18, integral: 0.25, estructural: 0.30}
    sin_visita: {ninguna: 0.0, refresco: 0.15, ligera: 0.18, media: 0.22, integral: 0.35, estructural: 0.40}
  plazo_obra_meses: {ninguna: 0, refresco: 1, ligera: 2, media: 3, integral: 5, estructural: 8}

ocupacion:                        # tabla §7.2 (P, I, coste y meses P50/P80)
  vacio:               {p: 1, i: 2, coste_p50: 800,  coste_p80: 1200, meses_p50: 0.5, meses_p80: 1}
  propietario:         {p: 3, i: 3, coste_p50: 3000, coste_p80: 4500, meses_p50: 5,   meses_p80: 8}
  precario:            {p: 4, i: 3, coste_p50: 6500, coste_p80: 9500, meses_p50: 7,   meses_p80: 11}
  arrendado_posterior: {p: 3, i: 3, coste_p50: 3000, coste_p80: 5000, meses_p50: 6,   meses_p80: 10}
  arrendado_anterior:  {p: 2, i: 3, coste_p50: 0,    coste_p80: 0,    meses_p50: 0,   meses_p80: 0}
  renta_antigua:       {p: 4, i: 5, coste_p50: 0,    coste_p80: 0,    meses_p50: 0,   meses_p80: 0}
  desconocida:         {usa: precario, techo_semaforo: amarillo}
  flip_arrendado_anterior: {p: 4, i: 4}      # el mismo hecho, distinto riesgo por estrategia (§10)
  rentista_arrendado_umbral_renta: 0.90      # renta ≥ 90% mercado ⇒ (2,3) para rentista

atrasos:
  defecto_pct_vt: 0.016           # estimación al alza si no hay certificado (P5)
  minimo: 1500
  stress_p80: 1.33

riesgos:
  pesos: {juridico: 0.16, documental: 0.08, ocupacion: 0.14, urbanistico: 0.10, tecnico: 0.10,
          financiero: 0.10, comercial: 0.10, liquidez: 0.10, mercado: 0.12}
  niveles: {bajo: 4, medio: 9, alto: 15, critico: 25}       # límites superiores P×I
  dominancia: {una_alta: 40, dos_altas: 55, critica_mitigable: 70, critica_no_mitigable: 85}
  bandas_ra: [{max: 24, banda: bajo}, {max: 45, banda: medio}, {max: 65, banda: alto},
              {max: 80, banda: muy_alto}, {max: 100, banda: critico}]

primas_ra:                        # tabla única §9.4
  bajo:     {mult_m: 0.90, stress_mercado: 0.07, delta_mercado_pp: 1.0, conting_pct: 0.05, y_req_pp: 0.25}
  medio:    {mult_m: 1.00, stress_mercado: 0.09, delta_mercado_pp: 2.0, conting_pct: 0.08, y_req_pp: 0.50}
  alto:     {mult_m: 1.20, stress_mercado: 0.12, delta_mercado_pp: 4.0, conting_pct: 0.12, y_req_pp: 1.00}
  muy_alto: {mult_m: 1.45, stress_mercado: 0.16, delta_mercado_pp: 6.0, conting_pct: 0.18, y_req_pp: 1.75}
  critico:  {mult_m: 1.45, stress_mercado: 0.18, delta_mercado_pp: 8.0, conting_pct: 0.22, y_req_pp: 2.50}   # banda vetada: precios solo informativos

ici:                              # §6.2
  pesos: {nota_simple: 18, cert_cargas: 14, posesion_verificada: 14, avaluo: 8,
          fotos_interior_o_visita: 10, fotos_exterior: 4, cert_comunidad: 8,
          recibo_ibi: 5, ite_cee: 5, catastro_conciliado: 6, comparables_ok: 8}
  frescura_nota_simple: [{max_dias: 15, factor: 1.0}, {max_dias: 45, factor: 0.6}, {max_dias: 9999, factor: 0.3}]
  penalizaciones: {superficie_inconsistente: 10, cargas_mismatch: 12, tasacion_anomala: 8, otra: 5}
  efectos:                        # tramos → (+δ_v pp, +contingencia pp, techo)
    - {min: 80, delta_pp: 0.0, conting_pp: 0.0, techo: null}
    - {min: 60, delta_pp: 2.0, conting_pp: 2.0, techo: null}
    - {min: 40, delta_pp: 5.0, conting_pp: 4.0, techo: amarillo}
    - {min: 25, delta_pp: 9.0, conting_pp: 7.0, techo: naranja}
    - {min: 0,  delta_pp: 12.0, conting_pp: 9.0, techo: rojo}
  multiplicador_ico_umbral: 60    # ICO ×(0.80+0.20·ICI/60) si ICI<60 (§8.5)

icu:                              # §6.4
  peso_macro: 0.40
  peso_micro: 0.60
  pesos_macro: {tendencia: 10, stock: 8, dom_venta: 7, dom_alquiler: 5, poblacion: 5, renta: 5}
  pesos_micro: {transporte: 10, seguridad: 8, sanidad: 5, educacion: 5, comercio: 4,
                zonas_verdes: 3, pipeline_urbanistico: 10, potencial_transformacion: 8, entorno_construido: 7}
  norm:
    tendencia: {min: -8.0, max: 8.0}
    stock_meses: {full: 4.0, zero: 18.0}
    dom_venta: {full: 60.0, zero: 300.0}
    dom_alquiler: {full: 15.0, zero: 90.0}
    poblacion: {min: -2.0, max: 3.0}
    renta: {min: 15000.0, max: 60000.0}

ico:                              # §8.5
  pesos: {rentabilidad: 25, juridico: 15, urbanistico: 7, financiero: 8,
          ubicacion: 15, revalorizacion: 10, liquidez: 12, informacion: 8}
  escalon_alta: 15                # −15 si alguna dimensión del grupo es Alta
  bonus_equity_financiero: 10
  liquidez_dom: {full: 45.0, zero: 300.0}
  utilidad_rentabilidad: {cero_en_frac_min: 0.5, u_objetivo: 60, u_max_frac: 1.6}

semaforo:                         # §8.6

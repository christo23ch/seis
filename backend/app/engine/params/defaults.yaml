# ── Procedimientos de subasta (Fase 5J-1, ADR-0022) ──────────────────────────
# Datos legales por procedimiento para los resultados INFORMATIVOS de
# `app/engine/procedimiento.py`. Ningún módulo M01-M14 los lee: no mueven la
# escalera, el RVC, el semáforo ni la rentabilidad.
# Fuente: docs/INVESTIGACION_PROCEDIMIENTOS_SUBASTA.md (consulta del BOE de 2026-10-06).
# Cada dato es {valor, articulo, estado[, nota]}:
#   · estado: confirmado (literal del texto consolidado del BOE) | sin_confirmar.
#   · valor null  ⇒ la regla existe pero no hay dato fiable: DATO AUSENTE (P4),
#     el motor no calcula con él y lo declara.
#   · clave ausente ⇒ la regla no existe en ese procedimiento.
#   · estricto: true ⇒ la norma exige SUPERAR el umbral, no igualarlo; se avisa.
# Porcentajes en tanto por uno sobre el valor de subasta. Los artículos se escriben
# «art. N, apdo. M» y no «N.M» porque el informe no admite dígito-punto-dígito.
# AVISO: investigación técnica, no asesoramiento jurídico (§ gobernanza).
procedimiento:
  # Si el alta no dice el procedimiento, se deduce de la fuente (y se avisa).
  # null ⇒ venta no reglada (bancaria o privada): sin umbrales legales.
  deducido_de_fuente: {judicial_boe: judicial, aeat: aeat, tgss: tgss, notarial: notarial,
                       concursal: concursal, banco: null, privada: null}
  # Fecha de efectos de la LO 1/2025 (DF 38.ª); solo se aplica a los procedimientos
  # incoados después (DT 9.ª.1). Se muestra en el formulario y en los avisos.
  fecha_lo_1_2025: "2025-04-03"
  regimenes:
    judicial_lec_2025:
      nombre: "Judicial (LEC tras la LO 1/2025, procedimientos iniciados desde el 3-4-2025)"
      deposito_pct: {valor: 0.20, articulo: "LEC, art. 669, apdo. 1 (LO 1/2025)", estado: confirmado,
                     nota: "El letrado de la Administración de Justicia puede elevarlo o reducirlo"}
      deposito_minimo_eur: {valor: 1000, articulo: "LEC, art. 669, apdo. 1 (LO 1/2025)", estado: confirmado}
      plazo_pago_dias: {valor: 20, unidad: naturales, articulo: "LEC, art. 670, apdos. 1 y 4", estado: confirmado}
      umbral_aprobacion_segura_pct: {valor: 0.70, articulo: "LEC, art. 670, apdo. 1", estado: confirmado}
      umbral_aprobacion_pct: {valor: 0.50, articulo: "LEC, art. 670, apdo. 3, párrafo 4", estado: confirmado}
      umbral_cubre_deuda_pct: {valor: 0.40, articulo: "LEC, art. 670, apdo. 3, párrafo 4", estado: confirmado}
      vivienda_habitual_umbral_pct: {valor: 0.70, articulo: "LEC, art. 670, apdo. 3, último párrafo", estado: confirmado}
      vivienda_habitual_suelo_pct: {valor: 0.60, articulo: "LEC, art. 670, apdo. 3, último párrafo", estado: confirmado}
      meses_inmovilizacion: {valor: 1.8, articulo: "LEC, arts. 649, 670 (apdos. 3 y 4)", estado: sin_confirmar,
                             nota: "Plazo legal máximo con mejora por tercero; incluye un plazo de notificación que la ley no fija"}
    judicial_lec_2015:
      nombre: "Judicial (LEC anterior a la LO 1/2025, procedimientos iniciados antes del 3-4-2025)"
      deposito_pct: {valor: 0.05, articulo: "LEC, art. 669, apdo. 1 (redacción de la Ley 19/2015)", estado: confirmado}
      plazo_pago_dias: {valor: 40, unidad: naturales, articulo: "LEC, art. 670, apdo. 1 (redacción de 2015)", estado: confirmado}
      umbral_aprobacion_segura_pct: {valor: 0.70, articulo: "LEC, art. 670, apdo. 1 (redacción de 2015)", estado: confirmado}
      umbral_aprobacion_pct: {valor: 0.50, articulo: "LEC, art. 670, apdo. 4 (redacción de 2015)", estado: confirmado,
                              estricto: true, nota: "La norma dice «supere el 50 %»"}
      # Sin suelo: bastaba con cubrir la cantidad reclamada (no había umbral del 40 %).
      umbral_cubre_deuda_pct: {valor: 0.0, articulo: "LEC, art. 670, apdo. 4 (redacción de 2015)", estado: confirmado}
      vivienda_habitual_umbral_pct: {valor: 0.70, articulo: "LEC, art. 670 (redacción de 2015)", estado: confirmado}
      vivienda_habitual_suelo_pct: {valor: 0.60, articulo: "LEC, art. 670 (redacción de 2015)", estado: confirmado}
      meses_inmovilizacion: {valor: 2.5, articulo: "LEC, arts. 649 y 670 (redacción de 2015)", estado: sin_confirmar,
                             nota: "Plazo legal máximo con el trámite de mejora; incluye notificaciones que la ley no fija"}
    aeat:
      nombre: "Agencia Tributaria (Reglamento General de Recaudación)"
      deposito_pct: {valor: 0.05, articulo: "RGR, art. 103 bis, apdo. 1", estado: confirmado}
      plazo_pago_dias: {valor: 15, unidad: naturales, articulo: "RGR, art. 104 bis, apdo. 3, letra b", estado: confirmado}
      umbral_aprobacion_segura_pct: {valor: 0.50, articulo: "RGR, art. 104 bis, apdo. 1", estado: confirmado}
      umbral_aprobacion_pct: {valor: 0.50, articulo: "RGR, art. 104 bis, apdo. 1", estado: confirmado,
